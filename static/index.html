<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Pedidos</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>🛒 Gestión de Pedidos</h1>
  </header>

  <div class="main-container">
    
    <main class="menu" id="menu">
      <section id="menu-section">
        <h2>Menú de Platillos</h2>
        
      </section>
    </main>

    
    <aside class="order-summary">
      <h2>🧾 Detalles del Pedido</h2>
      <ul class="order-items">
        <li>No hay items en tu pedido.</li>
      </ul>

      <div class="order-actions">
        <button class="order-btn">✅ Confirmar Pedido</button>
        <button class="order-btn secondary">✏️ Editar Pedido</button>
        <button class="order-btn danger">🗑️ Cancelar Pedido</button>
      </div>

      <h3>Pedidos guardados</h3>
      <ul class="pedidos-guardados">
        <li>Cargando pedidos...</li>
      </ul>
    </aside>
  </div>

  <footer>
    <p>© 2025 Restaurante VM - Gestión de Pedidos</p>
  </footer>

  <script src="/static/script.js"></script>
</body>
</html>
