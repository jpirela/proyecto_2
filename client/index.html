<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Recetario Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mi Recetario Online</h1>
    </header>

    <main>
        <section id="formulario-seccion">
            <h2>Agregar Nueva Receta</h2>
            <form id="formulario-receta">
                <div class="form-group">
                    <label for="nombre">Nombre de la Receta:</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="ingredientes">Ingredientes:</label>
                    <textarea id="ingredientes" rows="5" required></textarea>
                </div>
                <div class="form-group">
                    <label for="instrucciones">Instrucciones:</label>
                    <textarea id="instrucciones" rows="8" required></textarea>
                </div>
                <button type="submit">Guardar Receta</button>
            </form>
        </section>

        <section id="lista-recetas-seccion">
            <h2>Recetas Guardadas</h2>
            <div id="lista-recetas"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
