<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokémon Showdown Sim</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-light">

<div class="container py-4">
  <h1 class="text-center mb-4">Simulador Pokémon Showdown</h1>
  <p class="text-center">Selecciona dos Pokémon para iniciar la batalla:</p>

  <div class="row mb-3">
    <div class="col-md-6 mb-2">
      <input
        type="text"
        id="search-name"
        placeholder="Buscar Pokémon por nombre..."
        class="form-control"
      />
    </div>
    <div class="col-md-6 mb-2">
      <select id="filter-type" class="form-select">
        <option value="">Filtrar por tipo</option>
      </select>
    </div>
  </div>

  <div id="pokemon-list" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-3 mb-4"></div>

  <div id="pagination" class="d-flex justify-content-center mb-4"></div>

  <div class="text-center mb-4">
    <button id="start-battle-btn" class="btn btn-primary" disabled>Iniciar Batalla</button>
  </div>

  <div id="battle-area" class="mt-4 d-none">
    <h3 class="text-center">Batalla en Curso</h3>
    <div class="row text-center">
      <div class="col">
        <img id="img1" src="" alt="" class="mb-2" style="height:100px;">
        <h5 id="name1"></h5>
        <p>HP: <span id="hp1"></span></p>
      </div>
      <div class="col">
        <img id="img2" src="" alt="" class="mb-2" style="height:100px;">
        <h5 id="name2"></h5>
        <p>HP: <span id="hp2"></span></p>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="battleModal" tabindex="-1" aria-labelledby="battleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="battleModalLabel">¡Batalla Pokémon!</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="text-center">
          <h6 id="modal-status">Cargando batalla...</h6>
        </div>
        <div class="row text-center mt-3">
          <div class="col">
            <img id="modal-img1" src="" alt="" class="mb-2" style="height:100px;">
            <h5 id="modal-name1"></h5>
            <div class="mb-2">
              <div class="progress" style="height: 20px;">
                  <div id="modal-hpbar1" class="progress-bar bg-success" role="progressbar" style="width: 100%;">HP</div>
              </div>
            </div>
          </div>
          <div class="col">
            <img id="modal-img2" src="" alt="" class="mb-2" style="height:100px;">
            <h5 id="modal-name2"></h5>
            <div class="mb-2">
              <div class="progress" style="height: 20px;">
                  <div id="modal-hpbar2" class="progress-bar bg-success" role="progressbar" style="width: 100%;">HP</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="app.js"></script>

</body>
</html>
