<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <script src="https://unpkg.com/htmx.org@1.9.4"></script>
  <style>
    body { font-family: sans-serif; background-color: #f0f0f0; }
    .container {
      width: 400px; margin: 100px auto; background: white;
      padding: 30px; border-radius: 8px; box-shadow: 0 0 10px #ccc;
    }
    label, input, button, a { display: block; width: 100%; margin-bottom: 15px; }
    input { padding: 8px; }
    .links { display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="container">
    <form hx-post="/login" hx-target="body" hx-swap="innerHTML">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" required />

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required />

      <button type="submit">Ingresar</button>
    </form>

    <div class="links">
      <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQB">¿Olvidaste tu contraseña?</a>
      <a href="/register-page">Crear una cuenta</a>

    </div>
  </div>
</body>
</html>
